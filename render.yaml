services:
  - type: web
    name: skiller-smartbank
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn Application:app --bind 0.0.0.0:$PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: PYTHON_VERSION
        value: "3.9.18"
      - key: EMAIL_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      # SMTP_SERVER, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, EMAIL_API_KEY, SENDER_EMAIL
      # are set as secret env vars on Render dashboard
